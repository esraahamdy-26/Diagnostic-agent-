<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Diagnostic Agent - محادثة حرة</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; }
  .app { width: 480px; max-width: 100%; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
  header { background: #1a7a5e; color: white; padding: 14px 16px; font-size: 15px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
  .agent { background: #e9ecef; align-self: flex-start; border-bottom-left-radius: 2px; }
  .user { background: #1a7a5e; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
  .critical { background: #d32f2f !important; color: white !important; }
  .doctor { background: #f0a020 !important; }
  .recommendation { background: #2e7d32 !important; color: white !important; }
  .domain-chip { background: white; border: 1px solid #1a7a5e; color: #1a7a5e; padding: 6px 12px; border-radius: 14px; cursor: pointer; font-size: 13px; margin: 4px; }
  #domainChips { display: none; flex-wrap: wrap; padding: 0 16px 8px; }
  #inputArea { display: flex; padding: 12px; border-top: 1px solid #ddd; gap: 8px; }
  #inputArea input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #ccc; font-size: 15px; }
  #inputArea button { background: #1a7a5e; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; }
  #inputArea button:disabled { background: #aaa; }
</style>
</head>
<body>
<div class="app">
  <header>🩺 Diagnostic Agent — اكتبي بحرية زي أي شات عادي</header>
  <div id="chat"></div>
  <div id="domainChips"></div>
  <div id="inputArea">
    <label for="fileInput" style="background:#e9ecef;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;">📎
      <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none" onchange="uploadFile()">
    </label>
    <input id="textInput" placeholder="اكتبي اللي حاسة بيه..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()">إرسال</button>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";
let sessionId = null;

const DOMAIN_LABELS = {
  heart_disease: "القلب", cbc: "تحليل CBC", pathology: "تحاليل عامة",
  diabetes_risk_screening: "خطر السكر", hypertension_risk_screening: "خطر الضغط",
  radiology: "تقرير أشعة", general_wellness: "استفسار عام / نصيحة صحية"
};

function addMsg(text, who, tone) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + who + (tone ? " " + tone : "");
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function toneFromAction(action) {
  if (action === "escalate_emergency") return "critical";
  if (action === "escalate_to_doctor") return "doctor";
  if (action === "give_recommendation") return "recommendation";
  return null;
}

function showDomainChips(options) {
  const box = document.getElementById("domainChips");
  box.innerHTML = "";
  box.style.display = "flex";
  options.forEach(key => {
    const chip = document.createElement("span");
    chip.className = "domain-chip";
    chip.innerText = DOMAIN_LABELS[key] || key;
    chip.onclick = () => setDomain(key);
    box.appendChild(chip);
  });
}

function hideDomainChips() {
  document.getElementById("domainChips").style.display = "none";
}

async function startChat() {
  const res = await fetch(`${API_BASE}/chat/start`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({})
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMsg(data.message, "agent", toneFromAction(data.action));
}

async function setDomain(domain) {
  hideDomainChips();
  addMsg(DOMAIN_LABELS[domain] || domain, "user");
  const res = await fetch(`${API_BASE}/chat/${sessionId}/set_domain`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({domain})
  });
  handleResponse(await res.json());
}

function handleResponse(data) {
  addMsg(data.message, "agent", toneFromAction(data.action));
  if (data.action === "ask_domain" && data.data && data.data.options) {
    showDomainChips(data.data.options);
  } else {
    hideDomainChips();
  }
  if (data.action === "escalate_emergency") {
    document.getElementById("sendBtn").disabled = true;
    document.getElementById("textInput").disabled = true;
  }
}

async function send() {
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text || !sessionId) return;
  input.value = "";
  addMsg(text, "user");
  const res = await fetch(`${API_BASE}/chat/${sessionId}/message`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})
  });
  handleResponse(await res.json());
}

async function uploadFile() {
  const fileInput = document.getElementById("fileInput");
  const file = fileInput.files[0];
  if (!file || !sessionId) return;
  addMsg("📎 " + file.name, "user");
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch(`${API_BASE}/chat/${sessionId}/upload`, { method: "POST", body: formData });
  handleResponse(await res.json());
  fileInput.value = "";
}

startChat();
</script>
</body>
</html>
